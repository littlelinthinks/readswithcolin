  <!-- 外圈鎏金环（最外缘） -->
  <circle cx="32" cy="32" r="29.6" fill="none" stroke="#C9A961" stroke-width="0.7" opacity="0.95"/>

  <!-- ===== 错金 C 字：居中，开口朝右，开口约占圆周 1/8（45°）===== -->
  <!-- 外径 14，内径 9，开口对应弧度 45°，开口端点位于圆心角 ±22.5° -->
  <!-- 起点(上端): 32 + 14*cos(-90°-22.5°+90°) = 32 + 14*sin(-22.5°) ≈ 32 - 5.36, 32 - 12.94 -->
  <!-- 精确算: 外环开口端 = (32 + 14*cos(67.5°), 32 + 14*sin(67.5°)) = (32+5.36, 32+12.94) = (37.36, 44.94) [下端] -->
  <!-- 另一端 = (32 + 14*cos(-67.5°), 32 + 14*sin(-67.5°)) = (37.36, 19.06) [上端] -->
  <!-- 内径 9 的两端 = (32 + 9*cos(67.5°), 32 + 9*sin(67.5°)) = (35.44, 40.32) -->
  <!--                 = (32 + 9*cos(-67.5°), 32 + 9*sin(-67.5°)) = (35.44, 23.68) -->
  <path d="M 37.36 19.06
           A 14 14 0 1 0 37.36 44.94
           L 35.44 40.32
           A 9 9 0 1 1 35.44 23.68
           Z" fill="url(#jinLeaf)"/>
  <path d="M 37.36 19.06
           A 14 14 0 1 0 37.36 44.94
           L 35.44 40.32
           A 9 9 0 1 1 35.44 23.68
           Z" fill="url(#jinDark)"/>
  <path d="M 37.36 19.06
           A 14 14 0 1 0 37.36 44.94
           L 35.44 40.32
           A 9 9 0 1 1 35.44 23.68
           Z" fill="none" stroke="#7A5A24" stroke-width="0.35" opacity="0.6"/>

  <!-- ===== 镜钮：同心圆鎏金圆钮 ===== -->
  <circle cx="32" cy="32" r="2.4" fill="#8E6428"/>
  <circle cx="32" cy="32" r="2.0" fill="url(#jinDot)"/>
  <circle cx="32" cy="32" r="0.9" fill="#FAEFC0"/>
</svg>
