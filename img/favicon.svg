<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reads with Colin — 以铜为鉴">
  <title>Reads with Colin</title>

  <defs>
    <!-- 镜身：径向渐变，左上高光 -->
    <radialGradient id="jadeBody" cx="30%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#A8C9AF"/>
      <stop offset="18%"  stop-color="#86AC8E"/>
      <stop offset="45%"  stop-color="#5B7A64"/>
      <stop offset="78%"  stop-color="#3E5A4A"/>
      <stop offset="100%" stop-color="#284032"/>
    </radialGradient>

    <!-- 错金 C 字：右上亮、左下暗 -->
    <linearGradient id="jinLeaf" x1="22%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%"   stop-color="#F1D58A"/>
      <stop offset="35%"  stop-color="#E0BD6B"/>
      <stop offset="65%"  stop-color="#B68A3F"/>
      <stop offset="100%" stop-color="#7A5A24"/>
    </linearGradient>

    <!-- C 字暗面补丁 -->
    <linearGradient id="jinDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7A5A24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5C4218" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 镜钮：高亮金 -->
    <radialGradient id="jinDot" cx="35%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#F8E7AE"/>
      <stop offset="55%"  stop-color="#D8AE5E"/>
      <stop offset="100%" stop-color="#8E6428"/>
    </radialGradient>

    <!-- 镜身高光 -->
    <radialGradient id="hiLight" cx="28%" cy="26%" r="48%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 镜身 ===== -->
  <circle cx="32" cy="32" r="30" fill="url(#jadeBody)"/>

  <!-- 镜身高光（左上弧形亮斑） -->
  <ellipse cx="22" cy="20" rx="13" ry="9" fill="url(#hiLight)" transform="rotate(-38 22 20)"/>

  <!-- 内圈鎏金细线（紧贴镜身内侧） -->
  <circle cx="32" cy="32" r="28.4" fill="none" stroke="#C9A961" stroke-width="0.5" opacity="0.85"/>

  <!-- 雷纹刻带：64 段密排短弧（在 r=25 处） -->
