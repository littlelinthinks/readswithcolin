<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 922" preserveAspectRatio="xMidYMid slice">
  <rect width="615" height="922" fill="#F5F1E8"/>

  <!-- 圆相 Enso：一笔不闭合的圆 -->
  <path d="M 307 130
           A 115 115 0 1 0 400 165
           A 115 115 0 0 0 307 130"
        fill="none" stroke="#14110C" stroke-width="14" stroke-linecap="round"/>

  <!-- 朱红印章点 -->
  <rect x="392" y="318" width="34" height="34" rx="4" fill="#C73E2C"/>
  <text x="409" y="343" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="20" fill="#F5F1E8">初</text>

  <!-- 英文注释 -->
  <text x="307" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8A7F6A">In the beginner's mind there are many possibilities,</text>
  <text x="307" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8A7F6A">in the expert's mind there are few.</text>

  <!-- 书脊线 -->
  <line x1="80" y1="470" x2="535" y2="470" stroke="#14110C" stroke-width="1" opacity="0.25"/>

  <!-- 标题 -->
  <text x="307" y="560" text-anchor="middle" font-family="Georgia, 'Songti SC', 'Times New Roman', serif" font-size="56" font-weight="700" fill="#14110C" letter-spacing="6">禅者的初心</text>

  <!-- 英文 -->
  <text x="307" y="625" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="1" fill="#8A7F6A">Zen Mind, Beginner's Mind</text>

  <!-- 副标题 -->
  <line x1="220" y1="665" x2="395" y2="665" stroke="#14110C" stroke-width="1" opacity="0.4"/>
  <text x="307" y="703" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#8A7F6A">随时回到初学者的心</text>

  <!-- 作者 -->
  <text x="307" y="855" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#8A7F6A">SHUNRYU</text>
  <text x="307" y="877" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#8A7F6A">SUZUKI 铃木俊隆</text>
</svg>
