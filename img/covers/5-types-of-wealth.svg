  <text x="307" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#3E3320">A Transformative Guide</text>
  <text x="307" y="697" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#3E3320">to Designing Your Dream Life</text>

