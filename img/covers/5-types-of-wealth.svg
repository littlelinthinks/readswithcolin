  </g>

  <!-- 标题 -->
  <text x="307" y="490" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#3E3320">The 5 Types</text>
  <text x="307" y="538" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#3E3320">of Wealth</text>

  <!-- 中文 -->
  <text x="307" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="6" fill="#5B4A28" opacity="0.85">五种财富 · Five Wealths</text>

  <!-- 副标题 -->
