      <stop offset="0%" stop-color="#F2E6C5"/>
      <stop offset="100%" stop-color="#C9A961"/>
    </linearGradient>
  </defs>
  <rect width="615" height="922" fill="url(#bg-w)"/>

  <!-- 五级金色阶梯 -->
  <g transform="translate(307,290)">
    <rect x="-180" y="0" width="60" height="30" fill="#8B7340" stroke="#5B4A28" stroke-width="1"/>
