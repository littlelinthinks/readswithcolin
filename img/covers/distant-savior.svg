<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 922" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-savior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221F1B"/>
      <stop offset="100%" stop-color="#12100D"/>
    </linearGradient>
  </defs>
  <rect width="615" height="922" fill="url(#bg-savior)"/>

  <!-- 朱红圆月：文化属性 -->
  <circle cx="400" cy="215" r="105" fill="#C73E2C"/>
  <circle cx="400" cy="215" r="105" fill="none" stroke="#E8DCC8" stroke-width="1" opacity="0.3"/>

  <!-- 远山层叠 -->
  <path d="M 0 340 L 90 250 L 170 320 L 260 210 L 350 310 L 440 240 L 520 320 L 615 260 L 615 400 L 0 400 Z" fill="#2E2A24" opacity="0.95"/>
  <path d="M 0 380 L 120 300 L 230 370 L 340 290 L 460 370 L 560 310 L 615 350 L 615 430 L 0 430 Z" fill="#3A342B"/>
  <!-- 前景江面 -->
  <path d="M 0 430 Q 200 460 615 425 L 615 470 L 0 470 Z" fill="#14110C"/>

  <!-- 题字：神即道 -->
  <text x="150" y="200" font-family="Georgia, 'Songti SC', serif" font-size="34" fill="#E8DCC8" opacity="0.92" writing-mode="tb">神即道</text>
  <text x="205" y="200" font-family="Georgia, 'Songti SC', serif" font-size="34" fill="#E8DCC8" opacity="0.92" writing-mode="tb">道法自然</text>

  <!-- 书脊线 -->
  <line x1="80" y1="520" x2="535" y2="520" stroke="#C9A668" stroke-width="1" opacity="0.4"/>

  <!-- 标题 -->
  <text x="307" y="600" text-anchor="middle" font-family="Georgia, 'Songti SC', 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F0E6D2" letter-spacing="6">遥远的救世主</text>

  <!-- 副标题 -->
  <line x1="220" y1="655" x2="395" y2="655" stroke="#C9A668" stroke-width="1"/>
  <text x="307" y="692" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#C9A668">强势文化与弱势文化</text>
  <text x="307" y="715" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#A89678">得救之道，在自己</text>

  <!-- 作者 -->
  <text x="307" y="855" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#A89678">豆 豆</text>
</svg>
