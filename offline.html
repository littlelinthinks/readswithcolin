<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14110C">
<title>Reads with Colin — Offline</title>
<style>
  :root { --ink:#14110C; --paper:#FAF7F0; --gold:#C9A668; --red:#C73E2C; --muted:#7A7165; --sans:-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif; --serif:Georgia,"Times New Roman","Songti SC",serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html[lang="en"] [lang="zh"] { display:none !important; }
  html[lang="zh"] [lang="en"] { display:none !important; }
  body { background:var(--paper); color:var(--ink); font-family:var(--sans); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; line-height:1.7; }
  .wrap { max-width:460px; }
  .mark { width:84px; height:84px; border-radius:18px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:46px; font-weight:700; color:var(--red); margin:0 auto 24px; }
  h1 { font-family:var(--serif); font-size:30px; font-weight:700; }
  h1 em { color:var(--gold); font-style:italic; }
  p { margin-top:14px; font-size:16px; color:var(--muted); }
  a { display:inline-block; margin-top:28px; background:var(--gold); color:#fff; text-decoration:none; padding:14px 30px; border-radius:999px; font-weight:700; font-size:15px; }
  .hint { margin-top:18px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">C</div>
    <h1><span lang="en">You're <em>offline</em></span><span lang="zh">你已<em>离线</em></span></h1>
    <p><span lang="en">The page you opened is still here — your saved reads work without a connection. Reconnect to load the latest letter.</span><span lang="zh">你已打开过的页面仍可阅读，离线也能看。联网后会自动加载最新的内容。</span></p>
    <a href="./index.html"><span lang="en">Back to shelf</span><span lang="zh">返回书架</span></a>
    <div class="hint"><span lang="en">Tip: add Reads with Colin to your home screen to read anywhere.</span><span lang="zh">小提示：把 Reads with Colin 添加到主屏幕，随时随地都能读。</span></div>
  </div>
</body>
</html>
